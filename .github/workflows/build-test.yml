name: Build & Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore Voidwell.DaybreakGames.sln

      - name: Lint
        run: dotnet format DaybreakGames.Census.slnx --verify-no-changes --severity error --no-restore

      - name: Build
        run: dotnet build Voidwell.DaybreakGames.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Voidwell.DaybreakGames.sln --configuration Release --no-build --verbosity normal
