name: Build & Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Voidwell.DaybreakGames.slnx

      - name: Lint
        run: dotnet format Voidwell.DaybreakGames.slnx --verify-no-changes --severity error --no-restore

      - name: Build
        run: dotnet build Voidwell.DaybreakGames.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Voidwell.DaybreakGames.slnx --configuration Release --no-build --verbosity normal
